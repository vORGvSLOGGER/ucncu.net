name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/zen-noether-ly72i4, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          # served from https://<user>.github.io/ucncu.net/ — set to "" once
          # the custom domain ucncu.net is attached in Pages settings
          NEXT_PUBLIC_BASE_PATH: /ucncu.net
          # Supabase SSO (email OTP) — add these two repository secrets to
          # activate login; when absent the app runs in guest mode safely
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
